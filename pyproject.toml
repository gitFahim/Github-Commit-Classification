[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-classification"
version = "1.0.0"
description = "Reproduction of Levin & Yehudai (PROMISE 2017) — Automatic Commit Classification into Maintenance Activities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mehedi Hasan", email = "mehedi@example.com"},
    {name = "Fahim", email = "fahim@example.com"},
]
keywords = ["machine-learning", "software-maintenance", "commit-classification", "nlp", "research-reproduction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "nltk>=3.8",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pycm>=4.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/Mehedi-909/commit-classification"
Repository = "https://github.com/Mehedi-909/commit-classification"
